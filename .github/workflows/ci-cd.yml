name: Deploy to Cloud Run

on:
push:
branches:
- main
- cloudrun-cicd

jobs:
deploy:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Authenticate to GCP
    uses: google-github-actions/auth@v2
    with:
      credentials_json: '${{ secrets.GCP_SA_KEY }}'

  - name: Setup GCloud
    uses: google-github-actions/setup-gcloud@v2

  - name: Configure Docker
    run: |
      gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

  - name: Build Frontend
    run: |
      docker build -t asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mean-crud-repo/frontend:${{ github.sha }} ./frontend

  - name: Push Frontend
    run: |
      docker push asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mean-crud-repo/frontend:${{ github.sha }}

  - name: Deploy Frontend
    run: |
      gcloud run deploy frontend \
        --image asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mean-crud-repo/frontend:${{ github.sha }} \
        --region asia-south1 \
        --platform managed \
        --allow-unauthenticated \
        --port 80

  - name: Build Backend
    run: |
      docker build -t asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mean-crud-repo/backend:${{ github.sha }} ./backend

  - name: Push Backend
    run: |
      docker push asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mean-crud-repo/backend:${{ github.sha }}

  - name: Deploy Backend
    run: |
      gcloud run deploy backend \
        --image asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/mean-crud-repo/backend:${{ github.sha }} \
        --region asia-south1 \
        --platform managed \
        --allow-unauthenticated \
        --port 5000
```
